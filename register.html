<div class="login-box">
    <h2>用戶註冊</h2>
    <input type="text" id="reg-user" placeholder="設定帳號">
    <input type="password" id="reg-pass" placeholder="設定密碼">
    <button onclick="doRegister()">立即註冊</button>
    <p id="reg-msg"></p>
    <a href="login.html">已有帳號？去登入</a>
</div>

<script>
    async function doRegister() {
        const username = document.getElementById('reg-user').value;
        const password = document.getElementById('reg-pass').value;
        
        const res = await fetch('/api/register', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username, password })
        });
        const data = await res.json();
        if (data.success) {
            alert('註冊成功，請登入！');
            window.location.href = 'login.html';
        } else {
            document.getElementById('reg-msg').innerText = data.message;
        }
    }
</script>

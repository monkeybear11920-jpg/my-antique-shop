<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>古董店 - 管理後台</title>
	<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;700&display=swap" rel="stylesheet">
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"> 
    <link rel="stylesheet" href="style.css">

</head>
<body>
    <h1>店家回覆系統</h1>
	<div class="admin-container" style="display: flex;">
		<div id="customer-list" style="width: 200px; border-right: 1px solid #ccc;">
			<h3>對話列表</h3>
			<ul id="user-tabs"></ul>
		</div>

		<div id="chat-window" style="flex: 1;">
			<h3 id="current-user-title">請選擇客人</h3>
			<div id="chat-messages" style="height: 400px; overflow-y: auto;"></div>
			<input type="text" id="admin-input">
			<button onclick="sendToUser()">發送</button>
		</div>
	</div>

    <script src="data.js"></script>
    <script src="components.js"></script> 
	<script src="/socket.io/socket.io.js"></script>

    <script>
		let activeCustomerId = null;
		const customerMessages = {}; // 儲存各個客人的對話紀錄

		socket.on('new customer', (data) => {
			if (!customerMessages[data.id]) {
				customerMessages[data.id] = [];
				// 動態增加標籤頁按鈕
				const li = document.createElement('li');
				li.textContent = "客人 " + data.id.substring(0,5);
				li.onclick = () => switchUser(data.id);
				document.getElementById('user-tabs').appendChild(li);
			}
		});

		function switchUser(id) {
			activeCustomerId = id;
			document.getElementById('current-user-title').textContent = "正在與 " + id + " 對話";
			renderMessages();
		}

		function sendToUser() {
			const text = document.getElementById('admin-input').value;
			socket.emit('admin message', { targetId: activeCustomerId, text: text });
			document.getElementById('admin-input').value = '';
		}

        socket.on('chat message', (data) => {
            const msgArea = document.getElementById('chat-messages');
            const label = data.isAdmin ? '[我]' : '[客人]';
            msgArea.innerHTML += `<div><b>${label}:</b> ${data.text}</div>`;
            msgArea.scrollTop = msgArea.scrollHeight;
        });
    </script>
</body>
</html>

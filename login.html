<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>管理員登入 - 河馬博古幽思</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;700&display=swap" rel="stylesheet">
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"> 
    <link rel="stylesheet" href="style.css">
    <style>
        .login-box { width: 300px; margin: 100px auto; padding: 40px; background: white; border: 1px solid #eaddca; box-shadow: 0 4px 15px rgba(0,0,0,0.1); text-align: center; }
        .login-box input { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ddd; }
        .login-box button { width: 100%; padding: 10px; background: #8b4513; color: white; border: none; cursor: pointer; }
    </style>
</head>
<body style="background: #f4f1ea;">
    <div class="login-box">
        <h2><i class="fa-solid fa-hippo"></i> 管理員登入</h2>
        <input type="text" id="username" placeholder="帳號">
        <input type="password" id="password" placeholder="密碼" onkeypress="handleLoginKey(event)">
        <button onclick="doLogin()">登入</button>
        <p id="msg" style="color: red; font-size: 14px;"></p>
    </div>

    <script>
        function handleLoginKey(event) {
            if (event.key === 'Enter') {
                doLogin();
            }
        }

        async function doLogin() {
            const user = document.getElementById('username').value;
            const pass = document.getElementById('password').value;
            
            const res = await fetch('/api/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username: user, password: pass })
            });
            
            const result = await res.json();
			if (result.success) {
				// 存入 localStorage (包含 username 和 userId)
				localStorage.setItem('user', JSON.stringify({
					username: user,
					userId: result.userId // 確保後端 API 有回傳這個
				}));
				
				// 如果是 admin 就去後台，否則回首頁
				if (user === 'admin') {
					window.location.href = '/admin';
				} else {
					window.location.href = 'index.html';
				}
			}
        }
    </script>
</body>
</html>
